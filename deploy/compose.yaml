# 운영 구성: 단일 VM 에 서비스 5개 (docs/DEPLOYMENT.md 4절).
#   cp .env.example .env   # 값 채우기
#   docker compose up -d --build
#
# 공개 포트는 web(Caddy)의 80/443 뿐이다. backend·ai·db 는 내부 네트워크에만 있다 —
# 특히 ai 는 X-GitHub-Token 을 받으므로 포트를 열지 않는다.
name: gitory

# 컨테이너 로그를 CloudWatch 로그 그룹 /gitory 로 보낸다 (docs/DEPLOYMENT.md 7절).
# EC2 인스턴스 역할(CloudWatchAgentServerPolicy)로 보내므로 키를 두지 않는다. 스트림 이름은 컨테이너 이름이다.
# non-blocking: CloudWatch 가 느려도 서비스가 로그 쓰기에서 멈추지 않는다(버퍼가 차면 그 로그는 버린다).
# docker compose logs 는 Docker 의 이중 로깅으로 그대로 된다.
x-cloudwatch-options: &cloudwatch-options
  awslogs-region: ap-northeast-2
  awslogs-group: /gitory
  awslogs-create-group: "true"
  tag: "{{.Name}}"
  mode: non-blocking
  max-buffer-size: 4m

x-cloudwatch: &cloudwatch
  driver: awslogs
  options: *cloudwatch-options

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *cloudwatch
    environment:
      POSTGRES_DB: gitory
      POSTGRES_USER: gitory
      POSTGRES_PASSWORD: ${DB_PASSWORD:?deploy/.env 에 DB_PASSWORD 가 필요하다}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitory"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 매일 UTC 19:00(한국 04:00)에 db 를 pg_dump 로 백업한다 (docs/DEPLOYMENT.md 7절 DB 백업·복구).
  # pg_dump 버전이 DB 와 같아야 해서 db 와 같은 이미지를 쓴다.
  # 백업 폴더는 리포 밖이라 배포가 건드리지 않는다.
  db-backup:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *cloudwatch
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "/usr/local/bin/db-backup.sh"]
    environment:
      PGHOST: db
      PGUSER: gitory
      PGDATABASE: gitory
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db-backup.sh:/usr/local/bin/db-backup.sh:ro
      - /home/ubuntu/gitory-backups:/backups

  ai:
    build: ../ai
    image: gitory-ai
    restart: unless-stopped
    logging: *cloudwatch
    environment:
      AI_DOCS_ENABLED: "false"
      # 경험 그룹화·STAR 초안이 쓰는 LLM 게이트웨이. 비어 있으면 그 두 기능만 503 이고 수집·되묻기는 돈다
      GITORY_LLM_BASE_URL: ${GITORY_LLM_BASE_URL:-}
      GITORY_LLM_API_KEY: ${GITORY_LLM_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    build: ../backend
    image: gitory-backend
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        <<: *cloudwatch-options
        # 날짜로 시작하지 않는 줄(예외 스택)을 앞 줄과 한 이벤트로 묶어, 에러 하나가 알람 하나로 세어지게 한다
        awslogs-multiline-pattern: '^\d{4}-\d{2}-\d{2}'
    # ai 는 기다리지 않는다. AI 가 안 떠도 로그인·저장소 목록은 열려야 한다.
    # 분석 요청은 AI 연결이 실패하면 Job 이 실패로 끝난다.
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/gitory
      DB_USERNAME: gitory
      DB_PASSWORD: ${DB_PASSWORD}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?deploy/.env 에 GITHUB_CLIENT_ID 가 필요하다}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?deploy/.env 에 GITHUB_CLIENT_SECRET 이 필요하다}
      TOKEN_ENC_KEY: ${TOKEN_ENC_KEY:?deploy/.env 에 TOKEN_ENC_KEY 가 필요하다}
      TOKEN_ENC_SALT: ${TOKEN_ENC_SALT:?deploy/.env 에 TOKEN_ENC_SALT 가 필요하다}
      AI_BASE_URL: http://ai:8000
      # 분석 Job 이 수집 뒤 AI 경험 그룹화로 후보를 만든다. AI 에 LLM 설정을 넣고 확인한 뒤 true 로 켠다
      ANALYSIS_GROUPING_ENABLED: ${ANALYSIS_GROUPING_ENABLED:-false}
      # 후보로 만든 카드의 초안 Job 이 AI diff 근거·STAR 초안으로 칸을 채운다 (#212). 끄면 빈 카드로 끝난다
      CARD_AI_DRAFT_ENABLED: ${CARD_AI_DRAFT_ENABLED:-false}
    healthcheck:
      # readiness 그룹은 db 연결까지 본다. ai 는 넣지 않는다 (application.yml management 절)
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6

  web:
    build: ../frontend
    image: gitory-web
    restart: unless-stopped
    logging: *cloudwatch
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?deploy/.env 에 SITE_ADDRESS 가 필요하다}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 인증서를 보관한다. 지우면 재발급하는데, Let's Encrypt 발급 횟수 제한에 걸릴 수 있다.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
