<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img" aria-labelledby="title desc">
<title id="title">Gitory AI 파이프라인</title><desc id="desc">개발 기록을 수집하고 경험 후보를 묶어 사용자 선택을 거쳐 diff 기반 STAR 초안을 생성·검증·보강합니다. 확정 카드는 수집한 공고의 조건 색인과 비교합니다. 공고와 문항에 맞춰 카드를 선택하고 질문·작성·점검·첨삭을 거쳐 자소서 초안을 완성합니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#667085" stroke-width="1.6"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif;fill:#222}.muted{fill:#667085}.arrow{fill:none;stroke:#667085;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}</style>
<rect width="1280" height="840" rx="18" fill="#fff"/>
<text x="32" y="48" font-size="30" font-weight="700">개발 기록에서 지원까지</text>
<text x="32" y="80" font-size="17" font-weight="400" style="fill:#667085">AI의 제안에 근거 검증과 사용자 확인을 연결합니다.</text>
<text x="40" y="126" font-size="22" font-weight="700">01  경험 카드</text>
<text x="40" y="154" font-size="16" font-weight="400" style="fill:#667085">내 기여를 찾고, 내가 설명할 수 있는 경험으로 확정합니다.</text>
<rect x="40" y="175" width="216" height="112" rx="14" fill="#f7f9fc" stroke="#dfe3e8"/>
<text x="60" y="207" font-size="20" font-weight="650">기록 수집·필터</text>
<text x="60" y="235" font-size="16" font-weight="400" style="fill:#667085">내 커밋 · PR · 리뷰</text>
<text x="60" y="259" font-size="16" font-weight="400" style="fill:#667085">봇·머지 등 제외</text>
<path class="arrow" d="M256 231 H286"/>
<rect x="286" y="175" width="216" height="112" rx="14" fill="#f7f9fc" stroke="#dfe3e8"/>
<text x="306" y="207" font-size="20" font-weight="650">경험 그룹화</text>
<text x="306" y="235" font-size="16" font-weight="400" style="fill:#667085">함께 한 작업 묶기</text>
<text x="306" y="259" font-size="16" font-weight="400" style="fill:#667085">후보·추천 이유 생성</text>
<path class="arrow" d="M502 231 H532"/>
<rect x="532" y="175" width="216" height="112" rx="14" fill="#eaf4fd" stroke="#dfe3e8"/>
<text x="552" y="207" font-size="20" font-weight="650">후보 선택</text>
<text x="552" y="235" font-size="16" font-weight="400" style="fill:#667085">사용자가 작업 선택</text>
<text x="552" y="259" font-size="16" font-weight="400" style="fill:#667085">한 번에 최대 10개</text>
<path class="arrow" d="M748 231 H778"/>
<rect x="778" y="175" width="216" height="112" rx="14" fill="#f7f9fc" stroke="#dfe3e8"/>
<text x="798" y="207" font-size="20" font-weight="650">diff · STAR 초안</text>
<text x="798" y="235" font-size="16" font-weight="400" style="fill:#667085">선택한 코드 변경 분석</text>
<text x="798" y="259" font-size="16" font-weight="400" style="fill:#667085">문장별 근거 연결</text>
<path class="arrow" d="M994 231 H1024"/>
<rect x="1024" y="175" width="216" height="112" rx="14" fill="#eaf4fd" stroke="#dfe3e8"/>
<text x="1044" y="207" font-size="20" font-weight="650">검증·보강·확정</text>
<text x="1044" y="235" font-size="16" font-weight="400" style="fill:#667085">근거 검사 · 질문·답변</text>
<text x="1044" y="259" font-size="16" font-weight="400" style="fill:#667085">사용자 수정·확정</text>
<text x="40" y="362" font-size="22" font-weight="700">02  공고 매칭</text>
<text x="40" y="390" font-size="16" font-weight="400" style="fill:#667085">확정 카드의 경험을 공고 조건과 비교하고, 판단의 근거를 보여 줍니다.</text>
<rect x="40" y="411" width="276" height="112" rx="14" fill="#f7f9fc" stroke="#dfe3e8"/>
<text x="60" y="443" font-size="20" font-weight="650">공고 수집·조건 추출</text>
<text x="60" y="471" font-size="16" font-weight="400" style="fill:#667085">채용 사이트에서 수집</text>
<text x="60" y="495" font-size="16" font-weight="400" style="fill:#667085">원문 인용 검증</text>
<path class="arrow" d="M316 467 H348"/>
<rect x="348" y="411" width="276" height="112" rx="14" fill="#f7f9fc" stroke="#dfe3e8"/>
<text x="368" y="443" font-size="20" font-weight="650">조건 임베딩·색인</text>
<text x="368" y="471" font-size="16" font-weight="400" style="fill:#667085">공고 조건 벡터화</text>
<text x="368" y="495" font-size="16" font-weight="400" style="fill:#667085">ChromaDB 색인</text>
<path class="arrow" d="M624 467 H656"/>
<rect x="656" y="411" width="276" height="112" rx="14" fill="#f7f9fc" stroke="#dfe3e8"/>
<text x="676" y="443" font-size="20" font-weight="650">내 경험과 조건 비교</text>
<text x="676" y="471" font-size="16" font-weight="400" style="fill:#667085">확정 카드로 관련 조건 검색</text>
<text x="676" y="495" font-size="16" font-weight="400" style="fill:#667085">카드·인적사항으로 판단</text>
<path class="arrow" d="M932 467 H964"/>
<rect x="964" y="411" width="276" height="112" rx="14" fill="#f7f9fc" stroke="#dfe3e8"/>
<text x="984" y="443" font-size="20" font-weight="650">조건별 판단·근거</text>
<text x="984" y="471" font-size="16" font-weight="400" style="fill:#667085">맞음 · 모자람 · 직접 확인</text>
<text x="984" y="495" font-size="16" font-weight="400" style="fill:#667085">근거 카드·원문으로 연결</text>
<text x="40" y="598" font-size="22" font-weight="700">03  자소서 작성</text>
<text x="40" y="626" font-size="16" font-weight="400" style="fill:#667085">지원 공고와 문항에 맞는 재료를 고르고, 부족한 내용은 사용자에게 묻습니다.</text>
<rect x="40" y="647" width="216" height="112" rx="14" fill="#eaf4fd" stroke="#dfe3e8"/>
<text x="60" y="679" font-size="20" font-weight="650">공고·문항 입력</text>
<text x="60" y="707" font-size="16" font-weight="400" style="fill:#667085">지원 공고와 문항</text>
<text x="60" y="731" font-size="16" font-weight="400" style="fill:#667085">글자 수 설정</text>
<path class="arrow" d="M256 703 H286"/>
<rect x="286" y="647" width="216" height="112" rx="14" fill="#eaf4fd" stroke="#dfe3e8"/>
<text x="306" y="679" font-size="20" font-weight="650">카드·재료 확인</text>
<text x="306" y="707" font-size="16" font-weight="400" style="fill:#667085">문항별 경험 카드 선택</text>
<text x="306" y="731" font-size="16" font-weight="400" style="fill:#667085">사용자가 확인·변경</text>
<path class="arrow" d="M502 703 H532"/>
<rect x="532" y="647" width="216" height="112" rx="14" fill="#f7f9fc" stroke="#dfe3e8"/>
<text x="552" y="679" font-size="20" font-weight="650">부족한 내용 질문</text>
<text x="552" y="707" font-size="16" font-weight="400" style="fill:#667085">지원 이유 · 역할 · 결과</text>
<text x="552" y="731" font-size="16" font-weight="400" style="fill:#667085">사용자 답변 수집</text>
<path class="arrow" d="M748 703 H778"/>
<rect x="778" y="647" width="216" height="112" rx="14" fill="#f7f9fc" stroke="#dfe3e8"/>
<text x="798" y="679" font-size="20" font-weight="650">초안 작성·점검</text>
<text x="798" y="707" font-size="16" font-weight="400" style="fill:#667085">카드와 답변으로 작성</text>
<text x="798" y="731" font-size="16" font-weight="400" style="fill:#667085">근거 · 겹침 · 짐작 확인</text>
<path class="arrow" d="M994 703 H1024"/>
<rect x="1024" y="647" width="216" height="112" rx="14" fill="#eaf4fd" stroke="#dfe3e8"/>
<text x="1044" y="679" font-size="20" font-weight="650">보강·첨삭·활용</text>
<text x="1044" y="707" font-size="16" font-weight="400" style="fill:#667085">대화로 채우기 · 직접 수정</text>
<text x="1044" y="731" font-size="16" font-weight="400" style="fill:#667085">첨삭 적용 · 저장·복사</text>
</svg>
