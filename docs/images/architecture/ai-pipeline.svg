<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="642" viewBox="0 0 1280 642" role="img" aria-labelledby="title desc">
<title id="title">Gitory AI 파이프라인</title><desc id="desc">GitHub 개발 기록을 수집하고 규칙으로 커밋을 선별한 뒤 Luna로 경험 후보를 그룹화합니다. 사용자가 선택한 후보의 diff를 분석해 STAR 초안을 생성하고 백엔드가 저장합니다. 템플릿 질문과 사용자 답변으로 보강하며 답변은 백엔드가 새 버전으로 저장합니다.</desc>
<defs>
<symbol id="person" viewBox="0 0 32 32"><circle cx="16" cy="9" r="5"/><path d="M6 28v-4a10 10 0 0 1 20 0v4M2 28h28"/></symbol>
