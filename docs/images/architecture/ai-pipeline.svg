<symbol id="git" viewBox="0 0 32 32"><circle cx="9" cy="5" r="3"/><circle cx="9" cy="27" r="3"/><circle cx="25" cy="9" r="3"/><path d="M9 8v16m0-12c0 9 16 9 16 0"/></symbol>
<symbol id="chip" viewBox="0 0 32 32"><rect x="7" y="7" width="18" height="18" rx="3"/><path d="M12 1v6m8-6v6M12 25v6m8-6v6M1 12h6m-6 8h6m18-8h6m-6 8h6M12 12h8v8h-8Z"/></symbol>
<symbol id="cloud" viewBox="0 0 32 32"><path d="M8 26a7 7 0 0 1-1-14 10 10 0 0 1 19-1 8 8 0 0 1-1 15ZM11 31h10"/></symbol>
