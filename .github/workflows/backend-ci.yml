# 백엔드 CI — 팀이 추가한 워크플로다.
#
# CODEOWNERS 의 [운영진 영역] 3개 파일(assign-mentor · notify-discord · convention-check)은
# 건드리지 않는다. 새 워크플로 추가는 CODEOWNERS 주석이 명시적으로 허용한 범위다.
#
# develop 의 필수 체크다 (「빌드 · 테스트 · 경계 검사」·「마이그레이션 검사」).
#   pull_request 에 paths 필터를 걸면 backend 를 안 바꾼 PR 에서 워크플로가 아예 안 돌고,
#   GitHub 은 그 필수 체크를 계속 "대기 중"으로 둬서 머지가 막힌다.
#   그래서 PR 에서는 항상 돌고, changes job 이 backend 와 상관없는 PR 이면 build 를 건너뛴다.
#   job 조건으로 건너뛴 체크는 GitHub 이 통과로 친다. job 이름을 바꾸면 필수 체크 설정도 바꿔야 한다.

name: backend CI

on:
  pull_request:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - 'contracts/ingest/**'
      - '.github/workflows/backend-ci.yml'

# 같은 브랜치에 연속 push 하면 앞의 run 을 취소한다. 무료 러너 분을 아낀다.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  changes:
    name: 변경 범위 확인
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # PR 의 체크아웃은 base 와 합친 merge 커밋이라 첫 부모(HEAD^1)가 base 다.
      # push 는 위 paths 필터를 이미 통과했으므로 항상 돈다.
      - name: backend 관련 변경인지
        id: scope
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ] \
            || git diff --name-only HEAD^1 HEAD \
               | grep -qE '^(backend/|contracts/ingest/|\.github/workflows/backend-ci\.yml$)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend 변경 없음 — 빌드를 건너뛴다"
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: 빌드 · 테스트 · 경계 검사
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 준비 (캐시 포함)
        uses: gradle/actions/setup-gradle@v4

      # ArchUnit 모듈 경계 테스트가 여기 포함된다.
      # 경계를 주석으로만 적어 두면 두 달 뒤에 없는 경계가 된다.
      - name: build
        run: ./gradlew build --no-daemon

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/build/reports/tests/test/
          retention-days: 7
          if-no-files-found: ignore

  # 모든 PR 에서 돈다. 마이그레이션을 안 건드린 PR 은 바로 통과한다.
  migration-guard:
    name: 마이그레이션 검사
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 스키마의 단일 출처는 Flyway 다. 이미 머지된 마이그레이션을 고치면
      # 이미 그 버전을 적용한 환경과 체크섬이 어긋나 배포가 멈춘다.
      # 새 파일 추가는 통과, 기존 파일 수정은 실패다.
      - name: 적용된 마이그레이션이 수정되지 않았는지
        run: |
          base="origin/${{ github.event.pull_request.base.ref }}"
          changed=$(git diff --name-status "$base"...HEAD \
            -- backend/src/main/resources/db/migration/ \
            | awk '$1 != "A" { print $2 }')
          if [ -n "$changed" ]; then
            echo "::error::이미 머지된 마이그레이션을 수정했습니다. 새 V<n>__*.sql 을 추가하세요."
            echo "$changed"
            exit 1
          fi
          echo "마이그레이션 변경: 추가만 있음 (또는 없음)"

  migration-order:
    name: 마이그레이션 번호 순서 검사
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 서버 DB 에 적용된 가장 큰 번호보다 작거나 같은 V 파일이 들어오면 Flyway 검증이 실패해 서버가 뜨지 않는다
      # develop·main push 에서도 직전 커밋과 비교해 PR 검사 뒤에 다른 PR 이 먼저 머지된 경우까지 잡는다
      - name: 새 마이그레이션 번호가 기존 번호보다 큰지
        env:
          BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "비교할 직전 커밋이 없어 건너뜁니다."; exit 0
          fi
          git rev-parse --verify -q "$BASE^{commit}" > /dev/null || { echo "::error::비교할 커밋($BASE)을 찾지 못했습니다."; exit 1; }
          dir=src/main/resources/db/migration
          version() { sed -n 's|.*/V\([0-9._]*\)__.*|\1|p'; }
          max=$(git ls-tree --name-only "$BASE" "$dir/" | version | sort -n | tail -1)
          for v in $(git diff --name-only --no-renames --diff-filter=A "$BASE"...HEAD -- "$dir" | version); do
            if ! [ "$v" -gt "${max:-0}" ]; then
              echo "::error::새 마이그레이션 번호(V$v)는 정수이고 $BASE 의 가장 큰 번호(V$max)보다 커야 합니다. 파일 이름의 번호를 올리세요."; exit 1
            fi
          done
          echo "새 마이그레이션 번호: 모두 V${max:-0} 보다 큼 (또는 추가 없음)"
