<style>text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1f2328}.muted{fill:#59636e}.line{fill:none;stroke:#59636e;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}.icon{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1280" height="642" rx="16" fill="#fff"/>
<text x="28" y="46" font-size="28" font-weight="700" style="fill:#1f2328" text-anchor="start">AI 파이프라인</text>
<text x="28" y="75" font-size="16" font-weight="400" style="fill:#59636e" text-anchor="start">개발 기록에서 경험을 찾고, 사용자의 답변으로 완성</text>
<text x="28" y="116" font-size="18" font-weight="650" style="fill:#0f766e" text-anchor="start">경험 후보 탐색</text>
<rect x="28" y="142" width="268" height="138" rx="12" fill="#fff" stroke="#d1d9e0" />
<use href="#git" xlink:href="#git" x="46" y="161" width="29" height="29" class="icon" style="color:#0969da"/>
<text x="277" y="178" font-size="14" font-weight="600" style="fill:#59636e" text-anchor="end">01</text>
<text x="46" y="215" font-size="20" font-weight="650" style="fill:#1f2328" text-anchor="start">GitHub 기록 수집</text>
<text x="46" y="241" font-size="14" font-weight="400" style="fill:#59636e" text-anchor="start">커밋 · PR · 리뷰 · 이슈</text>
<text x="46" y="263" font-size="13" font-weight="550" style="fill:#0969da" text-anchor="start">AI 수집 → BE 저장</text>
<rect x="346" y="142" width="268" height="138" rx="12" fill="#fff" stroke="#d1d9e0" />
<use href="#filter" xlink:href="#filter" x="364" y="161" width="29" height="29" class="icon" style="color:#59636e"/>
<text x="595" y="178" font-size="14" font-weight="600" style="fill:#59636e" text-anchor="end">02</text>
<text x="364" y="215" font-size="20" font-weight="650" style="fill:#1f2328" text-anchor="start">커밋 선별·작업 단위 구성</text>
<text x="364" y="241" font-size="14" font-weight="400" style="fill:#59636e" text-anchor="start">본인 커밋과 PR·이슈 기준</text>
<text x="364" y="263" font-size="13" font-weight="550" style="fill:#59636e" text-anchor="start">규칙 처리</text>
<rect x="664" y="142" width="268" height="138" rx="12" fill="#fff" stroke="#d1d9e0" />
<use href="#group" xlink:href="#group" x="682" y="161" width="29" height="29" class="icon" style="color:#0f766e"/>
<text x="913" y="178" font-size="14" font-weight="600" style="fill:#59636e" text-anchor="end">03</text>
<text x="682" y="215" font-size="20" font-weight="650" style="fill:#1f2328" text-anchor="start">경험 그룹화</text>
<text x="682" y="241" font-size="14" font-weight="400" style="fill:#59636e" text-anchor="start">관련 작업 묶기 · 제목·설명</text>
<text x="682" y="263" font-size="13" font-weight="550" style="fill:#0f766e" text-anchor="start">Luna + 규칙</text>
<rect x="982" y="142" width="268" height="138" rx="12" fill="#fff" stroke="#d1d9e0" />
<use href="#select" xlink:href="#select" x="1000" y="161" width="29" height="29" class="icon" style="color:#1f2328"/>
<text x="1231" y="178" font-size="14" font-weight="600" style="fill:#59636e" text-anchor="end">04</text>
<text x="1000" y="215" font-size="20" font-weight="650" style="fill:#1f2328" text-anchor="start">후보 확인·선택</text>
<text x="1000" y="241" font-size="14" font-weight="400" style="fill:#59636e" text-anchor="start">정리할 경험을 사용자가 결정</text>
<text x="1000" y="263" font-size="13" font-weight="550" style="fill:#1f2328" text-anchor="start">사용자 → BE</text>
<rect x="28" y="392" width="268" height="138" rx="12" fill="#fff" stroke="#d1d9e0" />
<use href="#diff" xlink:href="#diff" x="46" y="411" width="29" height="29" class="icon" style="color:#0f766e"/>
<text x="277" y="428" font-size="14" font-weight="600" style="fill:#59636e" text-anchor="end">05</text>
<text x="46" y="465" font-size="20" font-weight="650" style="fill:#1f2328" text-anchor="start">diff 근거 분석</text>
<text x="46" y="491" font-size="14" font-weight="400" style="fill:#59636e" text-anchor="start">선택 커밋의 코드 변경 요약</text>
<text x="46" y="513" font-size="13" font-weight="550" style="fill:#0f766e" text-anchor="start">Luna · 비밀값 마스킹</text>
<rect x="346" y="392" width="268" height="138" rx="12" fill="#fff" stroke="#d1d9e0" />
<use href="#star" xlink:href="#star" x="364" y="411" width="29" height="29" class="icon" style="color:#0f766e"/>
<text x="595" y="428" font-size="14" font-weight="600" style="fill:#59636e" text-anchor="end">06</text>
<text x="364" y="465" font-size="20" font-weight="650" style="fill:#1f2328" text-anchor="start">STAR 초안 생성</text>
<text x="364" y="491" font-size="14" font-weight="400" style="fill:#59636e" text-anchor="start">근거 연결·검증 후 초안 저장</text>
<text x="364" y="513" font-size="13" font-weight="550" style="fill:#0f766e" text-anchor="start">Luna → BE 저장</text>
<rect x="664" y="392" width="268" height="138" rx="12" fill="#fff" stroke="#d1d9e0" />
<use href="#chat" xlink:href="#chat" x="682" y="411" width="29" height="29" class="icon" style="color:#0969da"/>
<text x="913" y="428" font-size="14" font-weight="600" style="fill:#59636e" text-anchor="end">07</text>
<text x="682" y="465" font-size="20" font-weight="650" style="fill:#1f2328" text-anchor="start">질문·답변 보강</text>
<text x="682" y="491" font-size="14" font-weight="400" style="fill:#59636e" text-anchor="start">빈칸 질문 → 사용자 답변</text>
<text x="682" y="513" font-size="13" font-weight="550" style="fill:#0969da" text-anchor="start">템플릿 → BE 버전 저장</text>
<rect x="982" y="392" width="268" height="138" rx="12" fill="#fff" stroke="#d1d9e0" />
<use href="#card" xlink:href="#card" x="1000" y="411" width="29" height="29" class="icon" style="color:#1f2328"/>
<text x="1231" y="428" font-size="14" font-weight="600" style="fill:#59636e" text-anchor="end">08</text>
<text x="1000" y="465" font-size="20" font-weight="650" style="fill:#1f2328" text-anchor="start">카드 확정·활용</text>
<text x="1000" y="491" font-size="14" font-weight="400" style="fill:#59636e" text-anchor="start">검토 · 수정 · 확정 · 복사</text>
<text x="1000" y="513" font-size="13" font-weight="550" style="fill:#1f2328" text-anchor="start">사용자</text>
<path d="M296 211H346" class="line"/>
<path d="M614 211H664" class="line"/>
<path d="M932 211H982" class="line"/>
<path d="M296 461H346" class="line"/>
<path d="M614 461H664" class="line"/>
<path d="M932 461H982" class="line"/>
<path d="M1116 280V319H12V461H28" class="line"/>
<rect x="425" y="301" width="424" height="35" rx="6" fill="#fff" stroke="none" />
<text x="637" y="324" font-size="15" font-weight="500" style="fill:#59636e" text-anchor="middle">사용자가 선택한 후보의 본인 커밋만 상세 분석</text>
<text x="28" y="366" font-size="18" font-weight="650" style="fill:#0f766e" text-anchor="start">STAR 카드 생성·보강</text>
<rect x="28" y="558" width="1222" height="58" rx="10" fill="#f6f8fa" stroke="none" />
<text x="46" y="582" font-size="14" font-weight="650" style="fill:#0f766e" text-anchor="start">LLM</text>
<text x="94" y="582" font-size="14" font-weight="400" style="fill:#59636e" text-anchor="start">경험 그룹화 · diff 근거 요약 · STAR 초안 생성</text>
<text x="46" y="604" font-size="14" font-weight="400" style="fill:#59636e" text-anchor="start">사용자 답변은 백엔드가 원문 그대로 새 버전으로 저장합니다. 답변 평가는 선택 설정에 따라 규칙 기반으로 실행됩니다.</text>
