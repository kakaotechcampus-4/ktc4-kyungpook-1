name: frontend
# develop 의 필수 체크는 「verify (22)」 하나다. 「verify (24)」 는 다음 버전 호환성만 미리 보고 막지 않는다.
#   pull_request 에 paths 필터를 걸면 frontend 를 안 바꾼 PR 에서 필수 체크가 계속 "대기 중"으로 남아
#   머지가 막힌다. 그래서 PR 에서는 항상 돌고, changes job 이 frontend 와 상관없는 PR 이면 검사를 건너뛴다.
#   job 조건으로 건너뛴 체크는 GitHub 이 통과로 친다.
#   matrix 를 쓰지 않고 두 job 으로 나눈 이유: matrix job 을 통째로 건너뛰면 체크 이름이
#   「verify (22)」 로 펼쳐지지 않아 필수 체크가 대기 중으로 남는다. job 이름을 바꾸면 필수 체크 설정도 바꿔야 한다.
on:
  pull_request:
  push:
    branches: [develop, main]
    paths: ['frontend/**', 'contracts/**', '.github/workflows/frontend-ci.yml']
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: 변경 범위 확인
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # PR 의 체크아웃은 base 와 합친 merge 커밋이라 첫 부모(HEAD^1)가 base 다.
      # push 는 위 paths 필터를 이미 통과했으므로 항상 돈다.
      - name: frontend 관련 변경인지
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ] \
            || git diff --name-only HEAD^1 HEAD \
               | grep -qE '^(frontend/|contracts/|\.github/workflows/frontend-ci\.yml$)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend 변경 없음 — 검사를 건너뛴다"
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  # 22 = frontend/.nvmrc 와 같은 값 (팀 표준, 로컬도 이 버전으로 맞춘다).
  node22:
    name: verify (22)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:static
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-test-results-node22
          path: frontend/test-results/
          retention-days: 7

  # 24 는 다음 버전 호환성만 미리 확인 — 실패해도 빌드는 안 막는다. 단계는 node22 와 같게 유지한다.
  node24:
    name: verify (24)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:static
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-test-results-node24
          path: frontend/test-results/
          retention-days: 7
