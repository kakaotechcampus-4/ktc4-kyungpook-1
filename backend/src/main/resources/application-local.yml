# 로컬 개발용. 비밀값은 여기 적지 않는다 — .env 또는 환경변수로 주입한다.
# (.gitignore 가 .env 를 추적하지 않지만, 이 파일은 추적되므로 더 조심한다.)
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gitory
    username: gitory
    password: gitory

server:
  servlet:
    session:
      cookie:
        # ⚠️ 로컬에서만 끈다. secure=true 인 쿠키는 http://localhost 응답에서 브라우저가
        # 저장하지 않아 로그인 왕복이 조용히 실패한다. 운영(application.yml)은 true 그대로다.
        secure: false

logging:
  level:
    com.gitory.backend: DEBUG
    org.hibernate.SQL: DEBUG
