name: frontend
on:
  pull_request:
    paths: ['frontend/**', 'contracts/**', '.github/workflows/frontend-ci.yml']
  push:
    branches: [develop, main]
    paths: ['frontend/**', 'contracts/**', '.github/workflows/frontend-ci.yml']
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.node == 24 }}
    strategy:
      fail-fast: false
      # 22 = frontend/.nvmrc 와 같은 값 (팀 표준, 로컬도 이 버전으로 맞춘다).
      # 24 는 다음 버전 호환성만 미리 확인 — 실패해도 빌드는 안 막는다.
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:static
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-test-results-node${{ matrix.node }}
          path: frontend/test-results/
          retention-days: 7
