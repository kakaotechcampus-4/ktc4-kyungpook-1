spring:
  application:
    name: gitory-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # 스키마의 단일 출처는 Flyway 다. JPA 는 검증만 한다 —
      # update 로 두면 운영에서 엔티티 수정이 곧 스키마 변경이 되어 되돌릴 수 없다.
      ddl-auto: validate
    # 뷰 렌더링 시점까지 영속성 컨텍스트를 열어 두지 않는다.
    # 커넥션을 요청 전체 동안 물고 있는 것이 분석 Job 과 겹치면 풀이 마른다.
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: false

  http:
    clients:
      # GitHub 호출 하나가 오래 멈춰도 저장소 목록 요청이 프론트 제한(30초) 안에 끝나게 한다.
      connect-timeout: 3s
      read-timeout: 10s

  session:
    # 세션은 DB 에 둔다. 토큰을 클라이언트에 두지 않는다는 원칙상 세션 쿠키가
    # 유일한 인증 수단이고, 인스턴스가 늘어나도 로그인이 유지돼야 한다.
    # (Boot 3 의 store-type 키는 Boot 4 에서 사라졌다 — 클래스패스에 있는 스토어가
    #  곧 저장소다. 그래서 spring-boot-starter-session-jdbc 가 build.gradle 에 있다.)
    jdbc:
      # SPRING_SESSION 두 테이블은 V3 마이그레이션이 만든다. 여기서 또 만들면
      # 스키마 출처가 둘이 된다 (V3 머리말).
      initialize-schema: never

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            # 최소 권한. 저장소 쓰기 권한은 요청하지 않는다.
            scope: read:user
            # 프론트 계약(BACKEND_CONTRACT.md)이 콜백 경로를 이 값으로 고정했다.
            # GitHub OAuth App 의 Authorization callback URL 도 같은 값이어야 한다.
            redirect-uri: "{baseUrl}/api/auth/github/callback"

server:
  # 리버스 프록시 뒤에 선다(HOSTING.md A안: / = 프론트, /api = Spring).
  # 이걸 켜지 않으면 redirect-uri 의 {baseUrl} 이 프록시가 아니라 내부 주소(http://localhost:8080)
  # 로 풀려 GitHub 이 redirect_uri 불일치로 거절한다.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        # 헬스체크만 연다. env·configprops 는 비밀값이 새는 경로다.
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        # ai 는 넣지 않는다. AI 가 꺼져도 로그인·저장소 목록은 받아야 한다 (분석 Job 만 실패한다).
        # AI 상태는 /actuator/health 전체 응답에 그대로 반영된다.
        readiness:
          include: readinessState,db

# 운영은 명시적으로 켰을 때만 문서를 제공한다. local 프로필에서는 기본으로 켠다.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
    path: /api/docs
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    path: /api/swagger-ui.html
    csrf:
      enabled: true
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN

gitory:
  ai:
    # Compose에서는 http://ai:8000. 토큰은 서버 설정이나 URL에 넣지 않는다.
    base-url: ${AI_BASE_URL:http://localhost:8000}
    connect-timeout: ${AI_CONNECT_TIMEOUT:3s}
    read-timeout: ${AI_READ_TIMEOUT:180s}
    # AI 가 커밋마다 GitHub 를 차례로 불러 커밋 1000개 저장소는 180초를 넘기므로 수집만 따로 길게 둔다
    # 멈춘 Job 판정은 이 값을 포함한 네 대기 한도 중 큰 값에 여유를 더해 계산하므로, 이 값이 가장 크면 늘릴수록 판정도 같이 늦춰진다
    collect-read-timeout: ${AI_COLLECT_READ_TIMEOUT:600s}
    # 경험 그룹화는 AI 가 LLM 을 여러 번 차례로 불러 오래 걸리므로 따로 길게 둔다
    groups-read-timeout: ${AI_GROUPS_READ_TIMEOUT:600s}
    # 프론트가 요청을 30초에 끊으므로 되묻기는 그 전에 AI 응답을 받아야 한다
    interview-read-timeout: 20s
    # 카드 초안의 diff 근거·STAR 초안은 AI 가 240초·150초 안에 정리해 답하므로, 그 답을 놓치지 않게 조금 더 기다린다
    diff-evidence-read-timeout: ${AI_DIFF_EVIDENCE_READ_TIMEOUT:300s}
    star-read-timeout: ${AI_STAR_READ_TIMEOUT:180s}
  github:
    # E2E 시험에서 가짜 GitHub 서버로 바꿀 수 있게 둔 값이며 운영은 기본값을 쓴다
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
  consent:
    # GitHub 액세스 토큰 암호화 키·솔트. 코드·설정 파일에 값을 적지 않는다 —
    # 배포 환경의 비밀 관리에서 환경변수로 주입한다(security-privacy.md).
    # 솔트는 16진수 문자열이어야 한다(예: 5c0744940b5c369b).
    # ⚠️ 키를 바꾸면 기존 token_enc 는 전부 복호화 불가가 된다. 교체하려면
    #    연결을 철회시켜 재로그인으로 토큰을 다시 받아야 한다.
    token-key: ${TOKEN_ENC_KEY}
    token-salt: ${TOKEN_ENC_SALT}
  job:
    worker:
      # 끄면 접수된 Job 이 실행되지 않는다. 테스트는 test 리소스의 config/application.yml 에서 끈다
      enabled: ${JOB_WORKER_ENABLED:true}
      # 동시에 실행하는 Job 수로 카드 초안 Job 도 같은 자리를 쓰며, 같은 사용자의 분석 Job·카드 초안 Job 은 종류마다 이 수와 상관없이 하나씩 실행한다
      concurrency: ${JOB_WORKER_CONCURRENCY:3}
  matching:
    sync:
      # 켜면 매일 새벽 5시(서울)에 회사 채용 공고를 가져오고 서버가 뜰 때 24시간 넘게 안 돌았으면 바로 한 번 돈다
      # 켜기 전에 회사별 이용 조건을 확인하며 서버가 여러 대여도 DB 잠금으로 한 곳에서만 돈다
      enabled: ${MATCHING_SYNC_ENABLED:false}
    sources:
      - { key: coupang, name: 쿠팡, type: GREENHOUSE, board: coupang }
      - { key: daangn, name: 당근, type: GREENHOUSE, board: daangn }
      - { key: krafton, name: 크래프톤, type: GREENHOUSE, board: krafton }
      - { key: furiosaai, name: 퓨리오사AI, type: GREENHOUSE, board: furiosaai }
      - { key: moloco, name: 몰로코, type: GREENHOUSE, board: moloco }
      - { key: sendbird, name: 센드버드, type: GREENHOUSE, board: sendbird }
  ingest:
    # api-data-assumptions.md '1차 구현 경계'. 초과분은 버리지 않고 partial=true 로 표시한다.
    max-commits: 1000
    max-pull-requests: 50
    max-issues: 50
    max-diff-bytes: 1048576
  retention:
    # 임시 인터뷰 초안은 마지막 활동 후 30일 보관 후 자동 삭제
    draft-days: 30
    # 계정 삭제 요청 시 서비스 데이터에서 삭제까지
    account-deletion-days: 7
  interview:
    # 카드당 되묻기 질문 최대 횟수.
    # AI 에는 요청의 max_turns, 프론트에는 응답의 maxTurns 로 내려준다.
    max-turns: 2
    answer-review:
      # 켜면 답을 저장한 뒤 AI 가 답이 충분한지 평가해, 모자라면 같은 칸의 질문을 하나 더 만든다(질문 상한 안에서)
      enabled: ${INTERVIEW_ANSWER_REVIEW_ENABLED:false}
  analysis:
    grouping:
      # 켜면 분석 Job 이 수집 뒤 AI 로 경험 그룹화를 해 후보를 만들고, 끄면 후보 추리기·추천 이유를 건너뛴다
      # 운영 AI 에 LLM 설정이 없으면 모든 분석이 실패하므로 그 설정을 넣고 한 번 확인한 뒤 켠다
      enabled: ${ANALYSIS_GROUPING_ENABLED:false}
      # AI 의 경험 그룹화 규칙이 바뀌면 올려, 보낼 요청이 지난번과 같아도 모든 저장소를 다시 경험 그룹화하게 한다
      version: 1
  cards:
    ai-draft:
      # 켜면 후보로 만든 카드의 초안 Job 이 AI diff 근거·STAR 초안으로 칸을 채우고, 끄면 빈 카드로 끝낸다
      # 운영 AI 에 LLM 설정이 없으면 모든 초안이 실패하므로 그 설정을 넣고 한 번 확인한 뒤 켠다
      enabled: ${CARD_AI_DRAFT_ENABLED:false}

logging:
  level:
    root: INFO
