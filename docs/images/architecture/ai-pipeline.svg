<symbol id="leaf" viewBox="0 0 32 32"><path d="M27 3c-2 9 6 20-10 24C3 29 0 16 9 10 15 6 22 8 27 3ZM5 28C9 19 17 15 23 12M11 21l-1-6m7 2 5 1"/></symbol>
