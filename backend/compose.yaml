# 로컬 개발용 PostgreSQL. 운영 구성이 아니다.
#   docker compose up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gitory
      POSTGRES_USER: gitory
      POSTGRES_PASSWORD: gitory
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitory"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - gitory-db:/var/lib/postgresql/data

volumes:
  gitory-db:
