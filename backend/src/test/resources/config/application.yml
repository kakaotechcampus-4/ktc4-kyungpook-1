# 테스트에서는 워커를 끈다 — 켜 두면 다른 테스트가 만든 QUEUED Job 을 집어 떠 있지 않은 AI 를 부른다
gitory:
  job:
    worker:
      enabled: false
    # 카드 초안 시험은 카드를 한 장씩 돌려 순서가 정해진 시험으로 두고, 같이 돌리는 시험만 장수를 올린다
    draft-parallel: 1
  cover-letter:
    worker:
      enabled: false
  matching:
    recommend:
      worker:
        enabled: false
  # 시험의 가짜 포트는 진행 없이 부르는 수집·그룹화만 흉내 내므로 끄고, 실시간 진행 시험은 따로 켠다
  analysis:
    live-progress:
      enabled: false
