spring:
  application:
    name: gitory-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # 스키마의 단일 출처는 Flyway 다. JPA 는 검증만 한다 —
      # update 로 두면 운영에서 엔티티 수정이 곧 스키마 변경이 되어 되돌릴 수 없다.
      ddl-auto: validate
    # 뷰 렌더링 시점까지 영속성 컨텍스트를 열어 두지 않는다.
    # 커넥션을 요청 전체 동안 물고 있는 것이 분석 Job 과 겹치면 풀이 마른다.
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: false

  data:
    redis:
      # 호출 제한(gitory.rate-limit)만 쓴다. 스위치가 꺼져 있으면 붙지 않는다
      host: ${REDIS_HOST:localhost}
      # Redis 가 멈춰도 요청이 오래 붙들리지 않고 제한을 건너뛰어 통과하도록 짧게 둔다
      connect-timeout: 500ms
      timeout: 500ms

  http:
    clients:
      # GitHub 호출 하나가 오래 멈춰도 저장소 목록 요청이 프론트 제한(30초) 안에 끝나게 한다.
      connect-timeout: 3s
      read-timeout: 10s

  session:
    # 세션은 DB 에 둔다. 토큰을 클라이언트에 두지 않는다는 원칙상 세션 쿠키가
    # 유일한 인증 수단이고, 인스턴스가 늘어나도 로그인이 유지돼야 한다.
    # (Boot 3 의 store-type 키는 Boot 4 에서 사라졌다 — 클래스패스에 있는 스토어가
    #  곧 저장소다. 그래서 spring-boot-starter-session-jdbc 가 build.gradle 에 있다.)
    jdbc:
      # SPRING_SESSION 두 테이블은 V3 마이그레이션이 만든다. 여기서 또 만들면
      # 스키마 출처가 둘이 된다 (V3 머리말).
      initialize-schema: never

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            # 최소 권한. 저장소 쓰기 권한은 요청하지 않는다.
            scope: read:user
            # 프론트 계약(BACKEND_CONTRACT.md)이 콜백 경로를 이 값으로 고정했다.
            # GitHub OAuth App 의 Authorization callback URL 도 같은 값이어야 한다.
            redirect-uri: "{baseUrl}/api/auth/github/callback"

server:
  # 리버스 프록시 뒤에 선다(HOSTING.md A안: / = 프론트, /api = Spring).
  # 이걸 켜지 않으면 redirect-uri 의 {baseUrl} 이 프록시가 아니라 내부 주소(http://localhost:8080)
  # 로 풀려 GitHub 이 redirect_uri 불일치로 거절한다.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        # 헬스체크만 연다. env·configprops 는 비밀값이 새는 경로다.
        include: health
  health:
    redis:
      # Redis 는 호출 제한에만 쓰고 멈추면 제한을 건너뛴다. health 에 섞이면 compose --wait 와 배포 확인이 Redis 때문에 실패한다
      enabled: false
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        # ai 는 넣지 않는다. AI 가 꺼져도 로그인·저장소 목록은 받아야 한다 (분석 Job 만 실패한다).
        # AI 상태는 /actuator/health 전체 응답에 그대로 반영된다.
        readiness:
          include: readinessState,db

# 운영은 명시적으로 켰을 때만 문서를 제공한다. local 프로필에서는 기본으로 켠다.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
    path: /api/docs
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    path: /api/swagger-ui.html
    csrf:
      enabled: true
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN

gitory:
  ai:
    # Compose에서는 http://ai:8000. 토큰은 서버 설정이나 URL에 넣지 않는다.
    base-url: ${AI_BASE_URL:http://localhost:8000}
    connect-timeout: ${AI_CONNECT_TIMEOUT:3s}
    read-timeout: ${AI_READ_TIMEOUT:180s}
    # AI 가 커밋마다 GitHub 를 차례로 불러 커밋 1000개 저장소는 180초를 넘기므로 수집만 따로 길게 둔다
    # 멈춘 Job 판정은 이 값을 포함한 네 대기 한도 중 큰 값에 여유를 더해 계산하므로, 이 값이 가장 크면 늘릴수록 판정도 같이 늦춰진다
    collect-read-timeout: ${AI_COLLECT_READ_TIMEOUT:600s}
    # 경험 그룹화는 AI 가 LLM 을 여러 번 차례로 불러 오래 걸리므로 따로 길게 둔다
    groups-read-timeout: ${AI_GROUPS_READ_TIMEOUT:600s}
    # 프론트가 요청을 30초에 끊으므로 되묻기는 그 전에 AI 응답을 받아야 한다
    interview-read-timeout: 20s
    # 카드 초안의 diff 근거·STAR 초안은 AI 가 240초·150초 안에 정리해 답하므로, 그 답을 놓치지 않게 조금 더 기다린다
    diff-evidence-read-timeout: ${AI_DIFF_EVIDENCE_READ_TIMEOUT:300s}
    star-read-timeout: ${AI_STAR_READ_TIMEOUT:180s}
    # AI 는 LLM 대기 120초에 시간 초과 뒤 한 번 더 시도해 최악 약 240초가 걸린다
    # 새벽 배치라 기다려도 되므로 그보다 길게 기다려, Spring 이 먼저 끊는 바람에 AI 가 계속 돌다 결과가 버려지는 일이 없게 한다
    posting-extract-read-timeout: ${AI_POSTING_EXTRACT_READ_TIMEOUT:300s}
    # 매칭 목록은 프론트가 요청을 30초에 끊으므로 AI 검색은 그 전에 답을 받아야 한다
    matching-search-read-timeout: 25s
    # 공고를 20개씩 임베딩해 색인하는 호출이라 새벽 배치에서 넉넉히 기다린다
    matching-index-read-timeout: ${AI_MATCHING_INDEX_READ_TIMEOUT:120s}
  github:
    # E2E 시험에서 가짜 GitHub 서버로 바꿀 수 있게 둔 값이며 운영은 기본값을 쓴다
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
  consent:
    # GitHub 액세스 토큰 암호화 키·솔트. 코드·설정 파일에 값을 적지 않는다 —
    # 배포 환경의 비밀 관리에서 환경변수로 주입한다(security-privacy.md).
    # 솔트는 16진수 문자열이어야 한다(예: 5c0744940b5c369b).
    # ⚠️ 키를 바꾸면 기존 token_enc 는 전부 복호화 불가가 된다. 교체하려면
    #    연결을 철회시켜 재로그인으로 토큰을 다시 받아야 한다.
    token-key: ${TOKEN_ENC_KEY}
    token-salt: ${TOKEN_ENC_SALT}
  job:
    worker:
      # 끄면 접수된 Job 이 실행되지 않는다. 테스트는 test 리소스의 config/application.yml 에서 끈다
      enabled: ${JOB_WORKER_ENABLED:true}
      # 동시에 실행하는 Job 수로 카드 초안 Job 도 같은 자리를 쓰며, 같은 사용자의 분석 Job·카드 초안 Job 은 종류마다 이 수와 상관없이 하나씩 실행한다
      concurrency: ${JOB_WORKER_CONCURRENCY:3}
  matching:
    sync:
      # 켜면 매일 새벽 5시(서울)에 회사 채용 공고를 가져오고 서버가 뜰 때 24시간 넘게 안 돌았으면 바로 한 번 돈다
      # 켜기 전에 회사별 이용 조건을 확인하며 서버가 여러 대여도 DB 잠금으로 한 곳에서만 돈다
      enabled: ${MATCHING_SYNC_ENABLED:false}
    sources:
      # 쿠팡은 회사 채용 사이트가 공고 경로에서 채용 집계 봇을 막고 있어 그 뜻을 따라 넣지 않는다
      - { key: daangn, name: 당근, type: GREENHOUSE, board: daangn }
      - { key: krafton, name: 크래프톤, type: GREENHOUSE, board: krafton }
      - { key: furiosaai, name: 퓨리오사AI, type: GREENHOUSE, board: furiosaai }
      - { key: moloco, name: 몰로코, type: GREENHOUSE, board: moloco }
      - { key: sendbird, name: 센드버드, type: GREENHOUSE, board: sendbird }
      - { key: lgairesearch, name: LG AI연구원, type: GREENHOUSE, board: lgairesearch }
      - { key: seoulrobotics, name: 서울로보틱스, type: GREENHOUSE, board: seoulrobotics }
      - { key: commvault, name: Commvault, type: GREENHOUSE, board: commvault }
      - { key: overdare, name: OVERDARE, type: GREENHOUSE, board: overdare }
      - { key: bluehole, name: 블루홀스튜디오, type: GREENHOUSE, board: bluehole }
      - { key: ujet, name: UJET, type: GREENHOUSE, board: ujet }
      - { key: riotgames, name: Riot Games 코리아, type: GREENHOUSE, board: riotgames }
      # 그리팅은 board 에 목록 페이지 주소를 적으며 리다이렉트를 따르지 않아 이동이 끝난 주소여야 한다
      - { key: upstage, name: 업스테이지, type: GREETING, board: 'https://careers.upstage.ai/ko/upstage' }
      - { key: kakaopay, name: 카카오페이, type: GREETING, board: 'https://careers.kakaopay.com/ko/main' }
      - { key: hyundai-autoever, name: 현대오토에버, type: GREETING, board: 'https://career.hyundai-autoever.com/ko/home' }
      - { key: stradvision, name: 스트라드비젼, type: GREETING, board: 'https://stradvision.career.greetinghr.com/ko/intro' }
      - { key: deepx, name: 딥엑스, type: GREETING, board: 'https://deepx.career.greetinghr.com/ko/career' }
      - { key: nextsecurities, name: 넥스트증권, type: GREETING, board: 'https://nextsecurities.career.greetinghr.com/ko/home' }
      - { key: interxlab, name: 인터엑스, type: GREETING, board: 'https://interxlab.career.greetinghr.com/ko/interxlab' }
      - { key: rebellions, name: 리벨리온, type: GREETING, board: 'https://rebellions.career.greetinghr.com/ko/accelerate-your-career' }
      - { key: ex-em, name: 엑셈, type: GREETING, board: 'https://ex-em.career.greetinghr.com/ko/intro' }
      - { key: realworld, name: 리얼월드, type: GREETING, board: 'https://realworld.career.greetinghr.com/ko/home' }
      - { key: xcena, name: 엑시나, type: GREETING, board: 'https://xcena.career.greetinghr.com/en/intro' }
      - { key: kurly, name: 컬리, type: GREETING, board: 'https://kurly.career.greetinghr.com/ko/home' }
      - { key: kakaomobility, name: 카카오모빌리티, type: GREETING, board: 'https://kakaomobility.career.greetinghr.com/ko/guide' }
      - { key: makinarocks, name: 마키나락스, type: GREETING, board: 'https://makinarocks.career.greetinghr.com/ko/home' }
      - { key: supercent, name: 슈퍼센트, type: GREETING, board: 'https://supercent.career.greetinghr.com/ko/career' }
      - { key: mangoboost, name: 망고부스트, type: GREETING, board: 'https://mangoboost.career.greetinghr.com/en/careers' }
      - { key: healingpaper, name: 강남언니(힐링페이퍼), type: GREETING, board: 'https://career.gangnamunni.com/ko/home' }
      - { key: autocrypt, name: 아우토크립트, type: GREETING, board: 'https://autocrypt.career.greetinghr.com/ko/home' }
      - { key: wrtn, name: 뤼튼테크놀로지스, type: GREETING, board: 'https://career.wrtn.io/ko/career' }
      - { key: pfct, name: PFCT, type: GREETING, board: 'https://pfct.career.greetinghr.com/ko/home' }
      - { key: riibotics, name: 리보틱스, type: GREETING, board: 'https://riibotics.career.greetinghr.com/ko/intro' }
      - { key: estfamily, name: 이스트소프트·이스트시큐리티, type: GREETING, board: 'https://estfamily.career.greetinghr.com/ko/home' }
      - { key: gccompany, name: 여기어때컴퍼니, type: GREETING, board: 'https://gccompany.career.greetinghr.com/ko/apply' }
      - { key: nuua, name: 누아, type: GREETING, board: 'https://nuua.career.greetinghr.com/ko/home' }
      - { key: moreh, name: 모레, type: GREETING, board: 'https://moreh.career.greetinghr.com/ko/jobs' }
      - { key: linqalpha, name: 링크알파, type: GREETING, board: 'https://linqalpha.career.greetinghr.com/en/intro' }
      - { key: ezcaretech, name: 이지케어텍, type: GREETING, board: 'https://ezcaretech.career.greetinghr.com/ko/home' }
      - { key: finda, name: 핀다, type: GREETING, board: 'https://finda.career.greetinghr.com/ko/career' }
      - { key: sionicai, name: 사이오닉에이아이, type: GREETING, board: 'https://sionicai.career.greetinghr.com/en/career' }
      - { key: mobilint, name: 모빌린트, type: GREETING, board: 'https://mobilinthire.career.greetinghr.com/ko/recruit' }
      - { key: buzzvil, name: 버즈빌, type: GREETING, board: 'https://buzzvil.career.greetinghr.com/ko/home' }
      - { key: featuring, name: 피처링, type: GREETING, board: 'https://featuring.career.greetinghr.com/ko/info' }
      - { key: neubility, name: 뉴빌리티, type: GREETING, board: 'https://neubility.career.greetinghr.com/ko/about' }
      - { key: ineeji, name: 이니지, type: GREETING, board: 'https://ineeji.career.greetinghr.com/ko/intro' }
      - { key: lawcompany, name: 로앤컴퍼니, type: GREETING, board: 'https://lawcompany.career.greetinghr.com/ko/home' }
      - { key: medistream, name: 메디스트림, type: GREETING, board: 'https://medistream.career.greetinghr.com/ko/career' }
      - { key: masangsoft, name: 마상소프트, type: GREETING, board: 'https://masangsoft.career.greetinghr.com/ko/careers' }
      - { key: shoplive, name: 샵라이브코리아, type: GREETING, board: 'https://shoplive.career.greetinghr.com/ko/intro' }
      - { key: sianalytics, name: 에스아이에이, type: GREETING, board: 'https://sianalytics.career.greetinghr.com/ko/home' }
      - { key: deepauto-ai, name: 딥오토에이아이, type: GREETING, board: 'https://deepauto-ai.career.greetinghr.com/ko/career' }
      # 자체 채용 사이트는 회사마다 읽는 모양이 달라 회사 하나가 종류 하나이고, board 에는 목록 주소를 적는다(카카오는 page 를 뺀 주소)
      - { key: toss, name: 토스, type: TOSS, board: 'https://api-public.toss.im/api/v3/ipd-eggnog/career/jobs' }
      - { key: lineplus, name: 라인플러스, type: LINE, board: 'https://careers.linecorp.com/page-data/ko/jobs/page-data.json' }
      - { key: kakao, name: 카카오, type: KAKAO, board: 'https://careers.kakao.com/public/api/job-list?part=TECHNOLOGY&company=KAKAO' }
      - { key: kt, name: KT, type: KT, board: 'https://recruit.kt.com/api/recruit?currentPage=1&pageSize=100&isInProgress=true&isContainsContents=true' }
      - { key: pearlabyss, name: 펄어비스, type: PEARL_ABYSS, board: 'https://www.pearlabyss.com/ko-KR/Company/Careers/List' }
      # 스마일게이트는 목록을 조회용 POST 로만 주어 board 에 그 주소를 적는다
      - { key: smilegate, name: 스마일게이트, type: SMILEGATE, board: 'https://careers.smilegate.com/api/apply/announce/guest' }
      # 로켓펀치는 한 곳에서 여러 회사의 공고를 주고, 공고마다 API 가 준 회사 이름으로 저장한다(웹 화면은 읽지 않고 API 만 쓴다)
      - { key: rocketpunch, name: 로켓펀치, type: ROCKETPUNCH, board: 'https://openapi.rocketpunch.com' }
    rocketpunch:
      # 키가 비어 있으면 로켓펀치는 건너뛴다. 로컬·CI 는 키 없이 돈다
      api-key: ${ROCKETPUNCH_API_KEY:}
      # 회사 채용 페이지를 위 sources 로 따로 읽는 회사의 로켓펀치 회사 id(handle). 같은 공고가 두 번 들어가지 않게 한다
      # 10/24 확인: 라인플러스는 라인 채용 사이트로, 이스트게임즈는 이스트패밀리 그리팅([ESTgames] 공고)으로 이미 읽는다
      skip-company-ids: [lineplus, estgames]
  ingest:
    # 아래 수집 상한은 AI 에 보내지 않아 바꾸면 AI 의 CollectionLimits 기본값도 같은 값으로 바꾼다
    # 커밋·이슈·최근 PR 밖의 내 PR 이 상한을 넘거나 PR 목록이 10쪽(1000개)을 채우면 partial=true 로 표시하고
    # 최근 max-pull-requests 개 밖의 남의 PR 은 표시 없이 읽지 않는다
    max-commits: 1000
    max-pull-requests: 50
    max-own-pull-requests: 50
    max-issues: 50
    max-diff-bytes: 1048576
  retention:
    # 임시 인터뷰 초안은 마지막 활동 후 30일 보관 후 자동 삭제
    draft-days: 30
    # 계정 삭제 요청 시 서비스 데이터에서 삭제까지
    account-deletion-days: 7
  interview:
    # 카드당 되묻기 질문 최대 횟수(넘긴 질문도 센다).
    # AI 에는 요청의 max_turns, 프론트에는 응답의 maxTurns 로 내려준다.
    max-turns: 3
  analysis:
    grouping:
      # 켜면 분석 Job 이 수집 뒤 AI 로 경험 그룹화를 해 후보를 만들고, 끄면 후보 추리기·추천 이유를 건너뛴다
      # 운영 AI 에 LLM 설정이 없으면 모든 분석이 실패하므로 그 설정을 넣고 한 번 확인한 뒤 켠다
      enabled: ${ANALYSIS_GROUPING_ENABLED:false}
      # AI 의 경험 그룹화 규칙이 바뀌면 올려, 보낼 요청이 지난번과 같아도 모든 저장소를 다시 경험 그룹화하게 한다
      version: 1
    live-progress:
      # 켜면 AI 수집·경험 그룹화를 진행 스트리밍 API 로 불러 분석 단계에 읽은 수/전체를 실시간으로 남기고, 끄면 한 번에 받는 API 로 부른다
      enabled: ${ANALYSIS_LIVE_PROGRESS_ENABLED:true}
  cards:
    # 후보로 카드 만들기 한 요청에 만들 수 있는 카드 수. 화면은 같은 값으로 선택을 막는다(CandidateBoardPage)
    max-per-request: 8
    ai-draft:
      # 켜면 후보로 만든 카드의 초안 Job 이 AI diff 근거·STAR 초안으로 칸을 채우고, 끄면 빈 카드로 끝낸다
      # 운영 AI 에 LLM 설정이 없으면 모든 초안이 실패하므로 그 설정을 넣고 한 번 확인한 뒤 켠다
      enabled: ${CARD_AI_DRAFT_ENABLED:false}
  rate-limit:
    # LLM 을 부르는 요청의 사용자별 호출 한도로, 하루는 서울 자정에 바뀐다. 숫자는 써 보며 조정한다
    # Redis 가 있는 운영에서만 켜고, 시험·로컬·E2E 는 끈 채로 Redis 없이 돈다
    enabled: ${RATE_LIMIT_ENABLED:false}
    # 되묻기 질문. 남아 있던 질문을 돌려줄 때는 세지 않는다
    interview-ask:
      per-minute: 10
      per-day: 100
    # '재 봤어요' 수치 문장 미리 보기. 입력에 숫자가 있어 LLM 을 부를 때만 센다
    interview-answer:
      per-minute: 10
      per-day: 100
    # 카드 만들기. CARD_AI_DRAFT_ENABLED 가 켜졌을 때만 한 요청의 카드 수만큼 센다
    card-draft:
      per-day: 100

logging:
  level:
    root: INFO
